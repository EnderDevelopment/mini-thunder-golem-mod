plugins {
    id 'java'
    id 'maven-publish'
}

group 'com.souritmal2011'
version '1.0'

repositories {
    mavenCentral()
    maven {
        url 'https://libraries.minecraft.net'
    }
    maven {
        url 'https://maven.minecraftforge.net'
    }
}

dependencies {
    implementation fg.deobf('net.minecraftforge:forge:1.21.4-47.2.0')
    implementation 'net.minecraftforge:minecraft:1.21.4'
    implementation 'net.minecraftforge:forge:1.21.4-47.2.0:deobf'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.21.4'
}

jar {
    archiveFileName = "minithundergolemmod-${version}.jar"
}
